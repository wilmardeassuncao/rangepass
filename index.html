<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RangePass - CRUD Material Design 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --md-sys-color-background: #121212;
            --md-sys-color-surface: #1e1e1e;
            --md-sys-color-primary: #e65100; 
            --md-sys-color-error: #b00020;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-outline: #79747e;
            --md-sys-color-on-surface: #e3e3e3;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #222;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 360px;
            height: 740px;
            background-color: var(--md-sys-color-background);
            border: 8px solid #000;
            border-radius: 36px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            padding: 24px;
            display: none;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            color: var(--md-sys-color-on-surface);
            text-align: center;
            font-size: 28px;
            margin-bottom: 32px;
            font-weight: 700;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 16px;
            background: transparent;
            border: 1px solid var(--md-sys-color-outline);
            border-radius: 8px;
            color: var(--md-sys-color-on-surface);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .input-group label {
            position: absolute;
            left: 16px;
            top: 16px;
            color: var(--md-sys-color-outline);
            transition: 0.2s ease all;
            pointer-events: none;
            background-color: var(--md-sys-color-background);
            padding: 0 4px;
        }

        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label,
        .input-group.campo-fixo label {
            top: -8px;
            left: 12px;
            font-size: 12px;
            color: var(--md-sys-color-primary);
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--md-sys-color-primary);
        }

        .input-group select option {
            background-color: var(--md-sys-color-surface);
        }

        .input-group input[type="date"] {
            color-scheme: dark;
        }

        .input-group select:disabled {
            opacity: 0.5;
        }

        .erro-campo {
            color: #ffb4ab;
            font-size: 13px;
            margin: 4px 0 0;
        }

        .erro-campo:empty {
            display: none;
        }

        .btn-pill {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            padding: 14px;
            border-radius: 100px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 10px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }

        .btn-error {
            background-color: var(--md-sys-color-error);
        }

        .btn-pill:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .aviso-erro {
            background-color: #3a1212;
            border: 1px solid #ffb4ab;
            border-radius: 12px;
            color: #ffb4ab;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 16px;
            padding: 12px;
        }

        .card-preview {
            background-color: var(--md-sys-color-surface);
            padding: 20px;
            border-radius: 16px;
            color: var(--md-sys-color-on-surface);
            margin-bottom: 20px;
            border: 1px solid #333;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        
        <div id="screen-home" class="screen active">
            <h1>RangePass</h1>
            <div class="card-preview" style="text-align: center;">
                <p>Seja bem vindo (a) ao nosso app</p>
                <p>Realize seu agendamento</p>
            </div>
            <button class="btn-pill" style="margin-top: auto;" onclick="navigate('screen-form')">Novo Agendamento</button>
        </div>

        <div id="screen-form" class="screen">
            <h1 id="form-title">RangePass</h1>
            <form id="appointmentForm" novalidate onsubmit="submitData(event)">
                <div class="input-group">
                    <input type="text" id="usuario" placeholder=" " required>
                    <label for="usuario">Nome do atirador</label>
                    <p class="erro-campo" id="erro-usuario"></p>
                </div>
                <div class="input-group campo-fixo">
                    <input type="date" id="data" required>
                    <label for="data">Data</label>
                    <p class="erro-campo" id="erro-data"></p>
                </div>
                <div class="input-group campo-fixo">
                    <select id="hora_inicio" required onchange="atualizarDuracoes()"></select>
                    <label for="hora_inicio">Horário de início</label>
                    <p class="erro-campo" id="erro-hora_inicio"></p>
                </div>
                <div class="input-group campo-fixo">
                    <select id="duracao_horas" required onchange="document.getElementById('erro-duracao_horas').textContent = ''"></select>
                    <label for="duracao_horas">Duração</label>
                    <p class="erro-campo" id="erro-duracao_horas"></p>
                </div>
                <div class="input-group campo-fixo">
                    <select id="instrutor" required></select>
                    <label for="instrutor">Instrutor</label>
                    <p class="erro-campo" id="erro-instrutor"></p>
                </div>
                <div class="input-group campo-fixo">
                    <select id="armamento" required></select>
                    <label for="armamento">Armamento</label>
                    <p class="erro-campo" id="erro-armamento"></p>
                </div>
                <div class="input-group">
                    <input type="number" id="municao" placeholder=" " min="50" step="1" required>
                    <label for="municao">Quantidade de munição (mínimo 50)</label>
                    <p class="erro-campo" id="erro-municao_qtd"></p>
                </div>
                <button type="submit" class="btn-pill" style="width: 100%;">Revisar agendamento</button>
            </form>
        </div>

        <div id="screen-details" class="screen">
            <h1>RangePass</h1>
            <div class="card-preview">
                <h3>Resumo das informações:</h3>
                <p><strong>Atirador:</strong> <span id="view-usuario"></span></p>
                <p><strong>Data:</strong> <span id="view-data"></span></p>
                <p><strong>Horário:</strong> <span id="view-horario"></span></p>
                <p><strong>Instrutor:</strong> <span id="view-instrutor"></span></p>
                <p><strong>Armamento:</strong> <span id="view-armamento"></span></p>
                <p><strong>Munição:</strong> <span id="view-municao"></span></p>
            </div>
            <div id="aviso-envio" class="aviso-erro" role="alert" hidden></div>
            <div style="display: flex; flex-direction: column; margin-top: auto;">
                <button id="btn-editar" class="btn-pill" onclick="editData()">Editar</button>
                <button id="btn-excluir" class="btn-pill btn-error" onclick="deleteData()">Excluir</button>
                <button id="btn-finalizar" class="btn-pill" style="background-color: #4caf50;" onclick="finalizar()">Finalizar</button>
            </div>
        </div>

        <div id="screen-success" class="screen">
            <h1>RangePass</h1>
            <div class="card-preview" style="margin-top: 100px; text-align: center;">
                <p style="font-size: 24px; color: #4caf50;">✓</p>
                <p>Agendamento realizado com sucesso</p>
                <p>Para alterar ou cancelar, fale com o estande.</p>
            </div>
            <button class="btn-pill" style="margin-top: auto;" onclick="resetApp()">Fechar App</button>
        </div>

    </div>

    <script src="regras.js"></script>
    <script>
        const webhookUrl = "https://hook.us2.make.com/s8tgskh4nt0vkymn7vxwm4vvrpz6ciyy";
        const TEMPO_LIMITE_ENVIO_MS = 60000;
        const MENSAGEM_FALHA_ENVIO = "Não foi possível confirmar seu agendamento. Seus dados foram mantidos. Verifique sua conexão e tente novamente.";
        const MENSAGEM_POSSIVEL_GRAVACAO = "Se você já tentou enviar antes, o agendamento pode ter sido gravado. Confirme com o estande antes de alterar.";
        const CAMPOS = {
            usuario: 'usuario',
            data: 'data',
            hora_inicio: 'hora_inicio',
            duracao_horas: 'duracao_horas',
            instrutor: 'instrutor',
            armamento: 'armamento',
            municao_qtd: 'municao'
        };

        let currentData = {};

        let houveFalhaDeEnvio = false;

        function textoDuracao(horas) {
            return horas === 1 ? '1 hora' : `${horas} horas`;
        }

        function preencherLista(id, opcoes) {
            const lista = document.getElementById(id);
            lista.replaceChildren(new Option('Selecione', ''));
            opcoes.forEach(opcao => lista.add(new Option(opcao.texto, opcao.valor)));
        }

        function montarFormulario() {
            const paraOpcao = valor => ({ texto: valor, valor });
            preencherLista('instrutor', INSTRUTORES.map(paraOpcao));
            preencherLista('armamento', ARMAMENTOS.map(paraOpcao));
            preencherLista('hora_inicio', HORAS_INICIO.map(hora => ({ texto: `${hora}h`, valor: hora })));
            document.getElementById('data').min = dataMinima(new Date());
            atualizarDuracoes();
        }

        function atualizarDuracoes() {
            const lista = document.getElementById('duracao_horas');
            const erro = document.getElementById('erro-duracao_horas');
            const horaEscolhida = document.getElementById('hora_inicio').value;
            const duracaoAnterior = lista.value;
            const duracoes = horaEscolhida ? duracoesPermitidas(Number(horaEscolhida)) : [];

            preencherLista('duracao_horas', duracoes.map(horas => ({
                texto: `${textoDuracao(horas)} (até ${Number(horaEscolhida) + horas}h)`,
                valor: horas
            })));
            lista.disabled = !horaEscolhida;
            lista.value = duracoes.includes(Number(duracaoAnterior)) ? duracaoAnterior : '';
            erro.textContent = duracaoAnterior && !lista.value
                ? `A sessão deve terminar até as ${HORA_FECHAMENTO}h. Selecione outra duração.`
                : '';
        }

        function lerFormulario() {
            const dados = {};
            Object.entries(CAMPOS).forEach(([campo, id]) => {
                dados[campo] = document.getElementById(id).value;
            });
            return dados;
        }

        function limparErros() {
            Object.keys(CAMPOS).forEach(campo => {
                document.getElementById(`erro-${campo}`).textContent = '';
            });
        }

        function mostrarErros(erros) {
            limparErros();
            Object.entries(erros).forEach(([campo, mensagem]) => {
                document.getElementById(`erro-${campo}`).textContent = mensagem;
            });

            const primeiroInvalido = Object.keys(CAMPOS).find(campo => erros[campo]);
            if (primeiroInvalido) document.getElementById(CAMPOS[primeiroInvalido]).focus();
        }

        function navigate(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function mostrarAviso(mensagem) {
            const aviso = document.getElementById('aviso-envio');
            aviso.textContent = mensagem;
            aviso.hidden = false;
        }

        function limparAviso() {
            const aviso = document.getElementById('aviso-envio');
            aviso.textContent = '';
            aviso.hidden = true;
            document.getElementById('btn-finalizar').textContent = 'Finalizar';
        }

        function definirEnvioEmAndamento(ativo) {
            document.getElementById('btn-finalizar').disabled = ativo;
            document.getElementById('btn-editar').disabled = ativo;
            document.getElementById('btn-excluir').disabled = ativo;
            document.getElementById('btn-finalizar').textContent = ativo ? 'Enviando...' : 'Finalizar';
        }

        function submitData(event) {
            event.preventDefault();
            limparAviso();

            const dados = lerFormulario();
            const erros = validarAgendamento(dados, new Date());
            mostrarErros(erros);
            if (Object.keys(erros).length > 0) return;

            currentData = montarEnvio(dados);

            document.getElementById('view-usuario').innerText = currentData.usuario;
            document.getElementById('view-data').innerText = formatarData(currentData.data);
            document.getElementById('view-horario').innerText = `${currentData.hora_inicio}h às ${currentData.hora_fim}h (${textoDuracao(currentData.duracao_horas)})`;
            document.getElementById('view-instrutor').innerText = currentData.instrutor;
            document.getElementById('view-armamento').innerText = currentData.armamento;
            document.getElementById('view-municao').innerText = currentData.municao_qtd;

            navigate('screen-details');
        }

        async function finalizar() {
            limparAviso();

            const erros = validarAgendamento(lerFormulario(), new Date());
            if (Object.keys(erros).length > 0) {
                mostrarAviso(`${Object.values(erros)[0]} Use Editar para corrigir.`);
                return;
            }

            definirEnvioEmAndamento(true);

            const controle = new AbortController();
            const limite = setTimeout(() => controle.abort(), TEMPO_LIMITE_ENVIO_MS);
            let resultado = 'falha';

            try {
                const resposta = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentData),
                    signal: controle.signal
                });
                resultado = interpretarResposta(resposta.ok, await resposta.text());
            } catch (error) {
                console.error('Falha ao enviar o agendamento:', error);
            } finally {
                clearTimeout(limite);
                definirEnvioEmAndamento(false);
            }

            if (resultado === 'sucesso') {
                navigate('screen-success');
                return;
            }

            if (resultado === 'conflito') {
                const conflito = `${currentData.instrutor} já está ocupado nesse horário. Altere o horário ou o instrutor em Editar.`;
                mostrarAviso(houveFalhaDeEnvio ? `${conflito} ${MENSAGEM_POSSIVEL_GRAVACAO}` : conflito);
                return;
            }

            houveFalhaDeEnvio = true;
            mostrarAviso(MENSAGEM_FALHA_ENVIO);
            document.getElementById('btn-finalizar').textContent = 'Tentar novamente';
        }

        function editData() {
            limparAviso();
            limparErros();
            document.getElementById('form-title').innerText = "Editar agendamento";
            document.getElementById('usuario').value = currentData.usuario;
            document.getElementById('data').value = currentData.data;
            document.getElementById('hora_inicio').value = currentData.hora_inicio;
            atualizarDuracoes();
            document.getElementById('duracao_horas').value = currentData.duracao_horas;
            document.getElementById('instrutor').value = currentData.instrutor;
            document.getElementById('armamento').value = currentData.armamento;
            document.getElementById('municao').value = currentData.municao_qtd;
            navigate('screen-form');
        }

        function deleteData() {
            if(confirm("Tem certeza de que deseja excluir este agendamento?")) {
                alert("Agendamento excluído.");
                resetApp();
            }
        }

        function resetApp() {
            limparAviso();
            limparErros();
            document.getElementById('appointmentForm').reset();
            atualizarDuracoes();
            document.getElementById('form-title').innerText = "RangePass";
            currentData = {};
            houveFalhaDeEnvio = false;
            navigate('screen-home');
        }

        montarFormulario();
    </script>
</body>
</html>
